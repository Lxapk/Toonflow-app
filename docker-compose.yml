# Toonflow 原版部署配置
#
# 镜像内容与上游官方源码完全一致，未做任何代码修改。
#
# ── 访问方式 ──────────────────────────────────────────────
# Toonflow 依赖 crypto.randomUUID、crypto.subtle 等浏览器 API，
# 这些 API 只在安全上下文中可用：
#   - https:// 任意地址
#   - http://localhost 或 http://127.0.0.1
#
# 用 http://<局域网IP>:3000 直接访问会报
#   crypto.randomUUID is not a function
# 页面无法启动，画布和节点也读不到。
#
# 可用的访问方式：
#   1. 反向代理配 HTTPS，访问 https://你的域名（推荐）
#   2. NAS 本机浏览器打开 http://localhost:3000
#   3. SSH 隧道：ssh -N -L 3000:127.0.0.1:3000 用户名@192.168.31.5
#      然后访问 http://localhost:3000
#
# ── 插件管理 ──────────────────────────────────────────────
# 安装技能 / 节点 / 扩展 / MCP 要求“本机访问”。
# 经反向代理访问时会被拒绝，提示“请在桌面端或服务器本机安装”。
# 需要安装插件时，请用上面的方式 2 或 3 访问后操作。
#
# ── 数据目录 ──────────────────────────────────────────────
# 使用命名卷 toonflowData 挂载到 /app/data。
# 不要换成宿主机目录，除非先执行 chown -R 1000:1000 该目录，
# 否则容器以 UID 1000 运行时会因权限不足启动失败。
#
# ── 安全提示 ──────────────────────────────────────────────
# 服务固定端口 3000，页面与 API 没有独立登录鉴权。
# 仅局域网使用时请配合防火墙限制来源；公网访问务必在反向代理层加认证。

services:
  toonflow:
    image: ghcr.io/lxapk/toonflow-app:latest
    container_name: toonflow
    init: true
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - toonflowData:/app/data

volumes:
  toonflowData:

name: Publish Docker image

# 构建对象是上游指定版本的源码 + 本仓库的 Dockerfile 等构建文件，
# 因此本仓库的 master 不需要跟随上游更新，也不会有推送 workflow 文件的权限问题。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 要构建的上游引用（标签或提交），留空则用上游最新正式版
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # 构建基准：上游官方仓库。
  upstream: HBAI-Ltd/Toonflow-app
  # 本仓库贡献 Dockerfile、.dockerignore 与最小补丁目录，源码取自上游。
  buildFiles: Dockerfile .dockerignore
  patchDir: patch

jobs:
  prepare:
    name: 确定构建版本
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      version: ${{ steps.resolve.outputs.version }}
      upstream_ref: ${{ steps.resolve.outputs.upstream_ref }}
      sha: ${{ steps.resolve.outputs.sha }}
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
      latest_tag: ${{ steps.resolve.outputs.latest_tag }}
      build: ${{ steps.resolve.outputs.build }}
      skip_reason: ${{ steps.resolve.outputs.skip_reason }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 计算构建文件指纹
        id: fingerprint
        run: |
          set -euo pipefail
          # 指纹覆盖本仓库贡献的构建文件（Dockerfile、.dockerignore、patch/），
          # 这样修改构建文件后，同版本也能触发重建。
          hash=$(git archive HEAD Dockerfile .dockerignore patch 2>/dev/null | sha256sum | awk '{print $1}')
          if [[ -z "$hash" ]]; then
            echo "无法计算构建文件指纹" >&2
            exit 1
          fi
          echo "fingerprint=$hash" >> "$GITHUB_OUTPUT"
          echo "构建文件指纹：$hash"

      - name: 解析上游引用
        id: resolve
        env:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          upstream: ${{ env.upstream }}
          requested: ${{ inputs.ref }}
          fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
        run: |
          set -euo pipefail
          echo "image=ghcr.io/${repository,,}" >> "$GITHUB_OUTPUT"

          if [[ -n "$requested" ]]; then
            upstream_ref="v${requested#v}"
          else
            upstream_ref=$(curl -fsS -H "Authorization: Bearer $token" -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${upstream}/releases/latest" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(String(JSON.parse(s).tag_name??"")))')
          fi
          if [[ -z "$upstream_ref" ]]; then
            echo "无法确定要构建的上游版本" >&2
            exit 1
          fi

          # 上游标签形如 v2.0.11；checkout 必须用带 v 的原引用，镜像标签用去 v 的版本。
          version="${upstream_ref#v}"
          if [[ ! "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._-]{0,127}$ ]]; then
            echo "无法生成合法的镜像标签：$version" >&2
            exit 1
          fi

          # 解析该引用对应的提交，写入镜像标签便于追溯。
          sha=$(git ls-remote "https://github.com/${upstream}.git" "refs/tags/${upstream_ref}^{}" | awk '{print $1}')
          if [[ -z "$sha" ]]; then
            sha=$(git ls-remote "https://github.com/${upstream}.git" "refs/tags/${upstream_ref}" | awk '{print $1}')
          fi
          if [[ -z "$sha" ]]; then
            sha=$(git ls-remote "https://github.com/${upstream}.git" "${upstream_ref}" | awk '{print $1}')
          fi

          echo "upstream_ref=$upstream_ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=${sha:-}" >> "$GITHUB_OUTPUT"

          # latest 只向前推进：先查当前带 latest 标签的版本，避免重建旧版本时把 latest 退回。
          # 镜像 index 不带 version 注解，因此从包版本列表里找出哪个版本持有 latest 标签。
          latest_tag="true"
          current=$(curl -s -m 30 -H "Authorization: Bearer $token" -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/users/${repository%%/*}/packages/container/${repository##*/}/versions?per_page=50" \
            2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);const hit=(Array.isArray(j)?j:[]).find(v=>((v.metadata?.container?.tags)||[]).includes("latest"));const tags=hit?.metadata?.container?.tags||[];process.stdout.write(String(tags.find(t=>/^\d+\.\d+/.test(t))??""))}catch{process.stdout.write("")}})' 2>/dev/null || true)

          # 只构建新版本，或版本号相同但上游提交已变的镜像。
          # 比较基准是镜像 label 里的 commit SHA，而不是版本号本身，
          # 这样上游重新指向同一个 tag 时也能重新构建。
          build="true"
          skip_reason=""

          # 读取某个镜像标签记录的 revision（上游提交）与构建文件指纹。
          image_meta() {
            local tag="$1"
            local authz anon idx amd cfg
            authz=$(curl -fsS "https://ghcr.io/token?scope=repository:${repository,,}:pull&service=ghcr.io" 2>/dev/null || true)
            [ -z "$authz" ] && return 0
            anon=$(node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).token??""))}catch{process.stdout.write("")}})' <<< "$authz" 2>/dev/null || true)
            [ -z "$anon" ] && return 0
            idx=$(curl -s -m 20 -H "Authorization: Bearer $anon" \
              -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/${repository,,}/manifests/${tag}" 2>/dev/null || true)
            amd=$(node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);const m=(j.manifests||[]).find(x=>(x.platform?.architecture||"amd64")==="amd64")||j;process.stdout.write(String(m.digest??""))}catch{process.stdout.write("")}})' <<< "$idx" 2>/dev/null || true)
            [ -z "$amd" ] && return 0
            cfg=$(curl -s -m 20 -H "Authorization: Bearer $anon" \
              -H "Accept: application/vnd.oci.image.manifest.v1+json" \
              "https://ghcr.io/v2/${repository,,}/manifests/${amd}" 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).config?.digest??""))}catch{process.stdout.write("")}})' 2>/dev/null || true)
            [ -z "$cfg" ] && return 0
            curl -sL -m 30 -H "Authorization: Bearer $anon" \
              "https://ghcr.io/v2/${repository,,}/blobs/${cfg}" 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const l=JSON.parse(s).config?.Labels||{};process.stdout.write(String(l["org.opencontainers.image.revision"]??"")+" "+String(l["io.toonflow.buildfingerprint"]??""))}catch{process.stdout.write("")}})' 2>/dev/null || true
          }

          same_meta=$(image_meta "$version")
          same_revision=$(echo "$same_meta" | awk '{print $1}')
          same_fingerprint=$(echo "$same_meta" | awk '{print $2}')

          if [[ -n "$current" ]]; then
            if [ "$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -1)" = "$version" ]; then
              if [ "$current" = "$version" ]; then
                # 同版本：上游提交与构建文件指纹都一致才跳过。
                if [[ -z "$same_revision" ]]; then
                  echo "镜像 $version 不存在或读不到元数据，将构建"
                elif [[ -n "${sha:-}" && "$same_revision" != "$sha" ]]; then
                  echo "镜像记录的提交为 $same_revision，上游现为 ${sha}，需要重建"
                elif [[ "$same_fingerprint" != "$fingerprint" ]]; then
                  echo "构建文件已变更（镜像 ${same_fingerprint:-无}，当前 ${fingerprint}），需要重建"
                else
                  build="false"
                  skip_reason="镜像 $version 已存在，上游提交与构建文件均未变化（${sha}），无需重复构建"
                fi
              else
                echo "$version 高于当前 latest（$current），将构建并更新 latest"
              fi
            else
              build="false"
              skip_reason="$version 低于当前最新版本 $current，已跳过"
            fi
          else
            echo "未能读取当前 latest 版本，按首次发布处理并更新 latest"
          fi
          if [[ "$build" != "true" ]]; then
            latest_tag="false"
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "skip_reason=$skip_reason" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "上游版本：$upstream_ref（commit=${sha:-未知}），镜像标签：$version$([[ "$latest_tag" == "true" ]] && echo '、latest')"

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ steps.resolve.outputs.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.resolve.outputs.version }}
            type=raw,value=latest,enable=${{ steps.resolve.outputs.latest_tag == 'true' }}
          labels: |
            org.opencontainers.image.title=Toonflow
            org.opencontainers.image.source=https://github.com/${{ env.upstream }}
            org.opencontainers.image.description=开源 AI 短剧、漫剧与视频创作平台
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.resolve.outputs.version }}
            org.opencontainers.image.revision=${{ steps.resolve.outputs.sha }}
            io.toonflow.buildfingerprint=${{ steps.fingerprint.outputs.fingerprint }}

  build:
    name: 构建 ${{ matrix.platform }}
    needs: prepare
    # 已存在或低于当前最新的版本直接跳过，不消耗构建额度。
    if: needs.prepare.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # 各架构都跑在同架构的原生 runner 上，避免 QEMU 模拟拖慢依赖安装与前端编译。
          - platform: linux/amd64
            arch: amd64
            os: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            os: ubuntu-24.04-arm
    steps:
      # 先取本仓库的构建文件（Dockerfile、.dockerignore），只用到这两项。
      - name: 检出构建文件
        uses: actions/checkout@v7
        with:
          path: buildFiles
          sparse-checkout: |
            Dockerfile
            .dockerignore
            patch
          persist-credentials: false

      # 再取上游源码作为构建上下文。
      - name: 检出上游源码
        uses: actions/checkout@v7
        with:
          repository: ${{ env.upstream }}
          ref: ${{ needs.prepare.outputs.upstream_ref }}
          path: src
          persist-credentials: false

      - name: 套用构建文件
        run: |
          set -euo pipefail
          for file in ${{ env.buildFiles }}; do
            cp "buildFiles/$file" "src/$file"
            echo "已套用 $file"
          done
          # 最小补丁：仅让 isLocalHostRequest 始终返回真，其余代码保持上游原样。
          python3 "buildFiles/${{ env.patchDir }}/apply.py" src
          echo "=== 构建上下文：上游 ${{ needs.prepare.outputs.upstream_ref }} ==="
          grep -n "oven/bun" src/Dockerfile

      - name: 释放 runner 磁盘空间
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: 登录 GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送单架构镜像
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: src
          platforms: ${{ matrix.platform }}
          # 版本号在构建时写入前后端产物，不传会显示为 electrobun.config.ts 的默认值 2.0.0。
          build-args: |
            appVersion=${{ needs.prepare.outputs.version }}
          # 按摘要推送，各架构互不覆盖；可读标签在 merge 任务合并清单时统一打上。
          outputs: type=image,name=${{ needs.prepare.outputs.image }},name-canonical=true,push-by-digest=true,push=true
          labels: ${{ needs.prepare.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: 验证镜像可启动
        env:
          image: ${{ needs.prepare.outputs.image }}
          digest: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # 在构建该架构的同一台 runner 上直接运行，无需 QEMU 即可验证镜像能否启动。
          docker pull "$image@$digest"
          docker run -d --name smoke -p 13000:3000 "$image@$digest"
          trap 'docker rm -f smoke' EXIT
          log="$RUNNER_TEMP/smoke.log"
          for _ in $(seq 1 90); do
            docker logs smoke > "$log" 2>&1 || true
            if grep -q "服务启动成功" "$log"; then break; fi
            sleep 2
          done
          cat "$log"
          grep -q "服务启动成功" "$log"
          # 先落地再匹配：curl 写入管道时 grep -q 提前关闭会触发 SIGPIPE，pipefail 下会误判失败。
          curl -fsS --retry 10 --retry-delay 2 -o "$RUNNER_TEMP/index.html" http://127.0.0.1:13000/
          grep -q "Toonflow" "$RUNNER_TEMP/index.html"

      - name: 保存镜像摘要
        env:
          digest: ${{ steps.build.outputs.digest }}
          arch: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          echo "${digest#sha256:}" > "$RUNNER_TEMP/digests/digest-$arch"

      - name: 上传镜像摘要
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/digest-${{ matrix.arch }}
          retention-days: 1

  report:
    name: 未构建说明
    needs: prepare
    if: needs.prepare.outputs.build != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: 输出跳过原因
        env:
          reason: ${{ needs.prepare.outputs.skip_reason }}
          version: ${{ needs.prepare.outputs.version }}
        run: |
          echo "跳过构建：$reason"
          {
            echo "## 未构建"
            echo ""
            echo "- 目标版本：\`${version}\`"
            echo "- 原因：$reason"
          } >> "$GITHUB_STEP_SUMMARY"

  merge:
    name: 合并多架构清单
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - name: 下载镜像摘要
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: 登录 GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 合并清单并打标签
        env:
          image: ${{ needs.prepare.outputs.image }}
          tags: ${{ needs.prepare.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && args+=(-t "$tag")
          done <<< "$tags"
          for arch in amd64 arm64; do
            args+=("$image@sha256:$(cat "$RUNNER_TEMP/digests/digest-$arch")")
          done
          docker buildx imagetools create "${args[@]}"
          docker buildx imagetools inspect "$(head -n 1 <<< "$tags")"

      - name: 记录结果
        env:
          image: ${{ needs.prepare.outputs.image }}
          version: ${{ needs.prepare.outputs.version }}
          upstream_ref: ${{ needs.prepare.outputs.upstream_ref }}
          sha: ${{ needs.prepare.outputs.sha }}
        run: |
          {
            echo "## 镜像已发布"
            echo ""
            echo "- 上游版本：\`${upstream_ref}\`（${sha}）"
            echo "- 镜像：\`${image}:${version}\`、\`${image}:latest\`"
            echo ""
            echo "拉取：\`docker pull ${image}:${version}\`"
          } >> "$GITHUB_STEP_SUMMARY"
